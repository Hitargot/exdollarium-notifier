# JVM args for Gradle daemon
# Allow both TLSv1.2 and TLSv1.3 so Gradle can negotiate properly
org.gradle.jvmargs=-Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2 -Xmx2048m -XX:MaxMetaspaceSize=512m

# Correct TLS property (note the dot after systemProp)
systemProp.https.protocols=TLSv1.2
systemProp.gradle.internal.httpclient=apache

android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=false
hermesEnabled=true

expo.gif.enabled=true
expo.webp.enabled=false
expo.webp.animated=false

EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false
expo.jsEngine=hermes
android.extraMavenRepos=[]
org.gradle.jvmargs=-Dhttps.protocols=TLSv1.2,TLSv1.3 -Xmx2048m -XX:MaxMetaspaceSize=512m
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.gradle.internal.httpclient=apache
